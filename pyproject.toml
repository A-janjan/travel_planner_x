[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planner-x"
version = "0.2.0"
description = "An AI-assisted travel planning web application with attraction discovery and itinerary generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "langchain>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "networkx>=3.3,<4",
    "openai>=1.80,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "rich>=13,<15",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
py-modules = ["main", "utils"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agents", "services", "workflows"]
exclude = ["data*", "frontend*", "tests*", "evaluation*"]
